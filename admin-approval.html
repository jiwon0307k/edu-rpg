<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경험치 통장 - 승인 관리</title>
    <link rel="stylesheet" href="css/style.css?v=20260906_ui3">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h2>🌼 경험치 통장 <span class="badge badge-admin">관리자</span></h2>
        </div>
        <div class="nav-right">
            <div class="notification-wrapper">
                <button class="notification-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-count" style="display:none;"></span></button>
                <div class="notification-dropdown" id="notif-dropdown">
                    <div class="notif-header"><span>알림</span><button class="btn-mark-all-read" onclick="markAllAsRead()">모두 읽음</button></div>
                    <div id="notif-list"></div>
                </div>
            </div>
            <a href="admin-students.html" class="btn btn-small btn-secondary">학생 관리</a>
            <a href="admin.html" class="btn btn-small btn-secondary">관리 설정</a>
            <button onclick="logout()" class="btn btn-small btn-secondary">로그아웃</button>
        </div>
    </nav>

    <main class="container">
        <div class="card">
            <div class="card-header">
                <h3>📝 승인 대기 목록</h3>
                <button id="approve-all-btn" class="btn btn-small btn-primary" onclick="approveAll()">전체 승인</button>
            </div>
            <div id="pending-list"></div>
            <p id="no-pending" class="text-center text-muted" style="display:none;">승인 대기 중인 항목이 없습니다.</p>
        </div>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal" style="display:none">
        <div class="modal modal-wide">
            <h3>✏️ 내용 수정</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-entry-id">
                <div class="form-row">
                    <div class="form-group admin-entry-col1">
                        <label>날짜</label>
                        <input type="date" id="edit-date">
                    </div>
                    <div class="form-group admin-entry-col1">
                        <label>인사</label>
                        <label class="checkbox-label" id="edit-greetings-label"><input type="checkbox" id="edit-greetings"><span>했어요</span></label>
                    </div>
                    <div class="form-group admin-entry-col1">
                        <label>과제 개수</label>
                        <input type="number" id="edit-assignments" min="0" max="20" value="0" class="input-small">
                    </div>
                    <div class="form-group admin-entry-col1">
                        <label>글쓰기</label>
                        <select id="edit-writing">
                            <option value="none">없음</option>
                            <option value="5%">감사 일기 (5%)</option>
                            <option value="10%">주제 글쓰기 (10%)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group admin-entry-col1" id="edit-bonus-group">
                    <label>보너스</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="number" id="edit-bonus-points" min="0" max="100" value="0">
                        <span>%</span>
                        <input type="text" id="edit-bonus-reason" placeholder="사유 입력">
                    </div>
                </div>
                <div class="form-group">
                    <label>가치 도장 (각 5%)</label>
                    <div id="edit-value-stamps"></div>
                </div>
                <div class="form-section">
                    <h4>칭호 (각 20%)</h4>
                    <div id="titles-section">
                        <div id="title-inputs">
                            <div class="title-row" style="margin-bottom: 6px;">
                                <input type="text" name="title-name" placeholder="칭호 이름 (없으면 비워두세요)" class="input-inline">
                            </div>
                        </div>
                        <button type="button" class="btn btn-small btn-secondary" id="add-title-btn" onclick="addTitleInput()" style="margin-top: 6px;">+ 칭호 추가</button>
                    </div>
                </div>
                <div class="form-actions">
                    <button id="save-edit-btn" type="button" class="btn btn-primary" onclick="saveEdit()">수정 저장</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"></script>
    <script src="js/supabase-config.js?v=20260906_ui3"></script>
    <script src="js/auth.js?v=20260906_ui3"></script>
    <script src="js/notifications.js?v=20260906_ui3"></script>
    <script src="js/xp-service.js?v=20260906_ui3"></script>
    <script src="js/date-util.js?v=20260906_ui3"></script>
    <script src="js/stamp-groups.js?v=20260906_ui3"></script>
    <script src="js/double-day.js?v=20260906_ui3"></script>
    <script src="js/admin-approval.js?v=20260906_ui3"></script>
</body>
</html>
