<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경험치 통장 - 학생 관리</title>
    <link rel="stylesheet" href="css/style.css?v=20260906_16">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h2>🌼 경험치 통장 <span class="badge badge-admin">관리자</span> <span id="double-day-badge" class="badge badge-double-day" style="display:none;">🔥 2배 Day 진행 중</span></h2>
        </div>
        <div class="nav-right">
            <div class="notification-wrapper">
                <button class="notification-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-count" style="display:none;"></span></button>
                <div class="notification-dropdown" id="notif-dropdown">
                    <div class="notif-header"><span>알림</span><button class="btn-mark-all-read" onclick="markAllAsRead()">모두 읽음</button></div>
                    <div id="notif-list"></div>
                </div>
            </div>
            <a href="admin.html" class="btn btn-small btn-secondary">관리 설정</a>
            <a href="admin-approval.html" class="btn btn-small btn-secondary">
                승인 관리 <span id="pending-count" class="count-badge" style="display:none;"></span>
            </a>
            <button onclick="logout()" class="btn btn-small btn-secondary">로그아웃</button>
        </div>
    </nav>

    <main class="container admin-split-container">
        <div class="split-view">
            <!-- Students Overview -->
            <div class="split-view-list card">
                <div class="card-header">
                    <h3>🐣 학생 목록</h3>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-small btn-secondary" onclick="syncAllXP()">XP 동기화</button>
                        <button class="btn btn-small btn-primary" onclick="showBatchEntryModal()">일괄 입력</button>
                    </div>
                </div>
                <table class="xp-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>레벨</th>
                            <th>누적 경험치</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="students-body"></tbody>
                </table>
            </div>

            <div class="split-view-detail">
                <!-- Placeholder shown until a student is selected -->
                <div class="card" id="student-detail-placeholder">
                    <p class="text-center text-muted" style="padding:60px 0;font-size:1rem;">👈🏻 학생을 선택하면 경험치 기록이 여기에 표시됩니다.</p>
                </div>

                <!-- Student Detail View (hidden by default) -->
                <div class="card" id="student-detail" style="display:none;">
                    <div class="card-header">
                        <h3>📖 <span id="detail-student-name"></span>의 경험치 기록</h3>
                        <button class="btn btn-small btn-secondary" onclick="hideStudentDetail()">닫기</button>
                    </div>
                    <div class="card-header" style="margin-top:8px;">
                        <div class="level-info-inline">
                            <span class="level-badge" id="detail-level-badge">Lv.1</span>
                            <span id="detail-xp-text">0%</span>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-small btn-primary" onclick="showAddEntryForm()">+ 경험치 추가</button>
                            <button class="btn btn-small btn-danger" onclick="showPenaltySection()">감점</button>
                        </div>
                    </div>

                    <!-- Admin Add Entry Form -->
                    <div id="admin-add-entry" class="inline-form" style="display:none;">
                        <h4>경험치 직접 추가</h4>
                        <div class="form-row">
                            <div class="form-group admin-entry-col1">
                                <label>날짜</label>
                                <input type="date" id="admin-entry-date">
                            </div>
                            <div class="form-group admin-entry-col1">
                                <label id="admin-insa-title">인사</label>
                                <label class="checkbox-label" id="admin-greetings-label"><input type="checkbox" id="admin-greetings"><span>했어요</span></label>
                            </div>
                            <div class="form-group admin-entry-col1">
                                <label id="admin-assignment-title">과제 개수</label>
                                <input type="number" id="admin-assignments" min="0" max="20" value="0" class="input-small">
                            </div>
                            <div class="form-group admin-entry-col1" id="admin-writing-group">
                                <label>글쓰기</label>
                                <select id="admin-writing">
                                    <option value="none">없음</option>
                                    <option value="5%" id="admin-writing-5-option">감사 일기 (5%)</option>
                                    <option value="10%" id="admin-writing-10-option">주제 글쓰기 (10%)</option>
                                </select>
                            </div>
                            <div class="form-group" id="admin-bonus-group">
                                <label>보너스</label>
                                <div style="display:flex;gap:8px;align-items:center;">
                                    <input type="number" id="admin-bonus-points" min="0" value="0" class="input-small">
                                    <span>%</span>
                                    <input type="text" id="admin-bonus-reason" placeholder="사유" class="input-inline">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label id="admin-stamp-title">가치 도장</label>
                            <div id="admin-value-stamps"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>칭호 (각 20%)</label>
                                <div id="admin-title-inputs">
                                    <div class="title-row" style="margin-bottom: 6px;">
                                        <input type="text" name="admin-title-name" placeholder="칭호 이름 (없으면 비워두세요)" class="input-inline">
                                    </div>
                                </div>
                                <button type="button" class="btn btn-small btn-secondary" onclick="addAdminTitleInput()" style="margin-top: 6px;">+ 칭호 추가</button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button id="admin-entry-submit-btn" class="btn btn-primary" onclick="submitAdminEntry()">추가</button>
                            <button class="btn btn-secondary" onclick="hideAddEntryForm()">취소</button>
                        </div>
                    </div>

                    <!-- Multi-Penalty Application Form -->
                    <div id="penalty-section" class="inline-form" style="display:none;flex-direction:column;align-items:stretch;">
                        <h4 style="color:#E66760;">🚨 감점 적용</h4>
                        <div id="penalty-rows"></div>
                        <button class="btn btn-small btn-secondary" onclick="addPenaltyRow()" style="align-self:flex-start;">+ 감점 추가</button>
                        <div id="penalty-preview" class="form-summary" style="display:none;">
                            <h4>예상 감점</h4>
                            <p id="penalty-preview-text"></p>
                        </div>
                        <div class="form-actions">
                            <button id="apply-penalty-btn" class="btn btn-danger" onclick="applyPenalties()">감점 적용</button>
                            <button class="btn btn-secondary" onclick="hidePenaltySection()">취소</button>
                        </div>
                    </div>

                    <div style="overflow-x:auto;">
                        <table class="xp-table" id="detail-table">
                            <thead id="detail-table-head"></thead>
                            <tbody id="detail-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Batch Entry Modal -->
    <div class="modal-overlay" id="batch-entry-modal" style="display:none;">
        <div class="modal modal-wide batch-entry-card">
            <h3>📋 일괄 입력</h3>

            <div class="batch-master-bar">
                <div class="form-group">
                    <label>날짜</label>
                    <input type="date" id="batch-date">
                </div>
                <div class="form-group">
                    <label>인사</label>
                    <label class="checkbox-label" id="batch-master-greetings-label"><input type="checkbox" id="batch-master-greetings" onchange="applyMasterToAllRows()"><span>했어요</span></label>
                </div>
                <div class="form-group">
                    <label>과제</label>
                    <input type="number" id="batch-master-assignments" min="0" max="20" value="0" class="input-small" oninput="applyMasterToAllRows()">
                </div>
                <div class="form-group">
                    <label>글쓰기</label>
                    <select id="batch-master-writing" onchange="applyMasterToAllRows()">
                        <option value="none">없음</option>
                        <option value="5%">감사 일기 (5%)</option>
                        <option value="10%">주제 글쓰기 (10%)</option>
                    </select>
                </div>
            </div>

            <div class="batch-table-wrap">
                <table class="xp-table batch-table">
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>인사</th>
                            <th>과제</th>
                            <th style="min-width:120px;">글쓰기</th>
                            <th style="min-width:210px;">예외</th>
                        </tr>
                    </thead>
                    <tbody id="batch-student-rows"></tbody>
                </table>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" id="batch-save-btn" onclick="saveBatchEntries()">전체 저장</button>
                <button class="btn btn-secondary" onclick="hideBatchEntryModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- Edit Entry Modal -->
    <div class="modal-overlay" id="edit-entry-modal" style="display:none;">
        <div class="modal modal-wide">
            <h3>✏️ 기록 수정</h3>
            <input type="hidden" id="edit-entry-id">
            <div class="form-row">
                <div class="form-group">
                    <label>날짜</label>
                    <input type="date" id="edit-entry-date-field">
                </div>
                <div class="form-group">
                    <label>인사</label>
                    <label class="checkbox-label"><input type="checkbox" id="edit-entry-greetings"><span>했어요</span></label>
                </div>
                <div class="form-group">
                    <label>과제 개수</label>
                    <input type="number" id="edit-entry-assignments" min="0" max="20" value="0" class="input-small">
                </div>
                <div class="form-group">
                    <label>글쓰기</label>
                    <select id="edit-entry-writing">
                        <option value="none">없음</option>
                        <option value="5%">감사 일기 (5%)</option>
                        <option value="10%">주제 글쓰기 (10%)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>보너스</label>
                <div style="display:flex;gap:8px;align-items:center;">
                    <input type="number" id="edit-entry-bonus-points" min="0" value="0" class="input-small">
                    <span>%</span>
                    <input type="text" id="edit-entry-bonus-reason" placeholder="사유" class="input-inline">
                </div>
            </div>
            <p class="text-muted" style="margin-left:0;">※ 가치 도장·칭호는 여기서 수정할 수 없습니다. 필요하면 기록을 삭제한 뒤 다시 추가해 주세요.</p>
            <div class="form-actions">
                <button class="btn btn-primary" id="edit-entry-save-btn" onclick="saveEntryRowEdit()">저장</button>
                <button class="btn btn-secondary" onclick="closeEditEntryModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- Edit Penalty Modal -->
    <div class="modal-overlay" id="edit-penalty-modal" style="display:none;">
        <div class="modal">
            <h3>✏️ 감점 수정</h3>
            <input type="hidden" id="edit-penalty-id">
            <div class="form-group">
                <label>감점 종류</label>
                <select id="edit-penalty-type"></select>
            </div>
            <div class="form-group">
                <label>횟수 (비율형은 단위 수)</label>
                <input type="number" id="edit-penalty-count" min="1" value="1" class="input-small">
            </div>
            <div class="form-group">
                <label>사유</label>
                <input type="text" id="edit-penalty-note" placeholder="사유 (선택)" class="input-inline">
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="edit-penalty-save-btn" onclick="savePenaltyRowEdit()">저장</button>
                <button class="btn btn-secondary" onclick="closeEditPenaltyModal()">취소</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"></script>
    <script src="js/supabase-config.js?v=20260906_16"></script>
    <script src="js/auth.js?v=20260906_16"></script>
    <script src="js/notifications.js?v=20260906_16"></script>
    <script src="js/xp-service.js?v=20260906_16"></script>
    <script src="js/date-util.js?v=20260906_16"></script>
    <script src="js/stamp-groups.js?v=20260906_16"></script>
    <script src="js/double-day.js?v=20260906_16"></script>
    <script src="js/admin-batch-entry.js?v=20260906_16"></script>
    <script src="js/admin-students.js?v=20260906_16"></script>
</body>
</html>
