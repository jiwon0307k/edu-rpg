<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경험치 통장 - 내 기록</title>
    <link rel="stylesheet" href="css/style.css?v=20260906_ui5">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h2>🌼 경험치 통장</h2>
        </div>
        <div class="nav-right">
            <span id="user-name" class="nav-user"></span>
            <div class="notification-wrapper">
                <button class="notification-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-count" style="display:none;"></span></button>
                <div class="notification-dropdown" id="notif-dropdown">
                    <div class="notif-header"><span>알림</span><button class="btn-mark-all-read" onclick="markAllAsRead()">모두 읽음</button></div>
                    <div id="notif-list"></div>
                </div>
            </div>
            <a href="student-input.html" class="btn btn-small btn-primary">경험치 입력</a>
            <button onclick="logout()" class="btn btn-small btn-secondary">로그아웃</button>
        </div>
    </nav>

    <main class="container">
        <!-- Level Display -->
        <div class="level-card">
            <div class="level-info">
                <span class="level-badge" id="level-badge">Lv.1</span>
                <span class="level-name" id="level-name"></span>
            </div>
            <div class="pending-xp-badge" id="pending-xp-badge" style="display:none;"></div>
            <div class="today-edit-banner" id="today-edit-banner" style="display:none;">
                <span>⏳ 오늘 제출한 기록이 승인 대기 중이에요.</span>
                <button class="btn btn-small btn-secondary" onclick="openTodayEditModal()">수정</button>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar" id="xp-bar" style="width: 0%"></div>
                <div class="exp-bar-pending" id="exp-bar-pending" style="width: 0%; left: 0%;"></div>
            </div>
            <div class="xp-text" id="xp-text">0%</div>
        </div>

        <!-- XP Table -->
        <div class="table-container">
            <h3>📖 경험치 기록</h3>
            <table class="xp-table" id="xp-table">
                <thead id="xp-table-head">
                    <tr>
                        <th>날짜</th>
                        <th>인사</th>
                        <!-- Dynamic value type columns inserted here -->
                        <th>과제</th>
                        <th>글쓰기</th>
                        <th>칭호</th>
                        <th>총 경험치</th>
                        <th>누적 경험치</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="xp-table-body">
                </tbody>
            </table>
            <p id="no-data" class="text-center text-muted" style="display:none;">아직 기록이 없습니다. 경험치를 입력해보세요!</p>
        </div>
    </main>

    <!-- Today's Pending Entry Edit Modal -->
    <div class="modal-overlay" id="today-edit-modal" style="display:none;">
        <div class="modal modal-wide">
            <h3>✏️ 오늘의 기록 수정</h3>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="today-edit-greetings">
                    <span>인사를 했습니다</span>
                </label>
            </div>
            <div class="form-group">
                <label for="today-edit-assignments">과제 개수</label>
                <input type="number" id="today-edit-assignments" min="0" max="20" value="0">
            </div>
            <div class="form-group">
                <label>글쓰기</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="today-edit-writing" value="none"><span>없음</span></label>
                    <label class="radio-label"><input type="radio" name="today-edit-writing" value="5%"><span>감사 일기 (5%)</span></label>
                    <label class="radio-label"><input type="radio" name="today-edit-writing" value="10%"><span>주제 글쓰기 (10%)</span></label>
                </div>
            </div>
            <div class="form-group">
                <label>가치 도장</label>
                <div id="today-edit-value-stamps"></div>
            </div>
            <div class="form-group">
                <label>칭호 (각 20%)</label>
                <div id="today-edit-title-inputs">
                    <div class="title-row" style="margin-bottom: 6px;">
                        <input type="text" name="today-edit-title-name" placeholder="칭호 이름 (없으면 비워두세요)" class="input-inline">
                    </div>
                </div>
                <button type="button" class="btn btn-small btn-secondary" onclick="addTodayEditTitleInput()" style="margin-top: 6px;">+ 칭호 추가</button>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="today-edit-save-btn" onclick="saveTodayEntryEdit()">저장</button>
                <button class="btn btn-secondary" onclick="closeTodayEditModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- Level Up Celebration Modal -->
    <div class="modal-overlay" id="level-up-modal" style="display:none;">
        <div class="modal level-up-card">
            <div class="level-up-badge" id="level-up-badge">Lv.1</div>
            <h3 id="level-up-title">🎉 레벨 업! 한 단계 성장했어요!</h3>
            <button class="btn btn-level-up" onclick="closeLevelUpModal()">확인</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/supabase-config.js?v=20260906_ui3"></script>
    <script src="js/auth.js?v=20260906_ui3"></script>
    <script src="js/notifications.js?v=20260906_ui3"></script>
    <script src="js/date-util.js?v=20260906_ui3"></script>
    <script src="js/stamp-groups.js?v=20260906_ui3"></script>
    <script src="js/student.js?v=20260906_ui4"></script>
</body>
</html>
